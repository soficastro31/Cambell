<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva solicitud - Cambell</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <nav class="navbar">
        <div class="logo">Cambell</div>
        <div class="nav-links">
            <a th:href="@{/solicitudes/mis-solicitudes}">Mis solicitudes</a>
            <form th:action="@{/logout}" method="post" style="display:inline;">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <button type="submit" style="background:none; border:none; color:white; cursor:pointer; font-weight:500;">Cerrar sesión</button>
</form>
        </div>
    </nav>

    <section class="auth-container">
        <div class="auth-card">
            <h2>Solicitar un servicio</h2>
            <form th:action="@{/solicitudes/nueva}" th:object="${solicitud}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <label>¿Qué necesitas?</label>
                <input type="text" th:field="*{descripcion}" placeholder="Ej. Arreglo de fuga en la cocina" required/>

                <label>Zona</label>
                <input type="text" th:field="*{zona}" placeholder="Ej. Chapinero, Bogotá" required/>

                <button type="submit" class="btn-hero-principal">Enviar solicitud</button>
            </form>
        </div>
    </section>

</body>
</html>
