<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mis anuncios - Cambell</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <nav class="navbar">
        <div class="logo">Cambell</div>
        <div class="nav-links">
            <a th:href="@{/anuncios/mios}">Mis anuncios</a>
            <a th:href="@{/notificaciones}">Notificaciones
                <span th:if="${noLeidos > 0}" style="background:#FF6B00; color:#fff; border-radius:10px; padding:1px 7px; font-size:11px;" th:text="${noLeidos}"></span>
            </a>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" style="background:none; border:none; color:white; cursor:pointer; font-weight:500;">Cerrar sesión</button>
            </form>
        </div>
    </nav>

    <section style="padding: 60px; max-width: 900px; margin: 0 auto;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
            <h2 style="margin:0;">Mis anuncios</h2>
            <a th:href="@{/anuncios/mios/nuevo}" class="btn-hero-principal" style="width:auto; text-decoration:none;">+ Publicar anuncio</a>
        </div>

        <p th:if="${ok}" style="color:#4CAF50; font-weight:600;" th:text="${ok}"></p>
        <p th:if="${error}" style="color:#ff4d4d; font-weight:600;" th:text="${error}"></p>

        <div th:each="a : ${anuncios}" style="background:#1e1e1e; padding:20px; border-radius:8px; margin-bottom:15px;">
            <p><strong th:text="${a.titulo}"></strong></p>
            <img th:if="${a.rutaImagen != null}" th:src="@{${a.rutaImagen}}" style="max-width:180px; border-radius:6px; margin:10px 0;"/>
            <p style="color:#bbb;" th:text="${a.descripcion}"></p>
            <p>
                Estado:
                <span th:switch="${a.estado.name()}"
                      style="font-weight:700;
                             padding:2px 10px; border-radius:10px;
                             background:#4a4a16; color:#e6d35a;">
                    <span th:case="'PENDIENTE'">Pendiente de revisión</span>
                    <span th:case="'PUBLICADO'" style="background:#14401f; color:#5ae66a;">Publicado</span>
                    <span th:case="'RECHAZADO'" style="background:#401414; color:#ff6b6b;">Rechazado</span>
                </span>
            </p>
            <p th:if="${a.motivoRechazo != null}" style="color:#ff4d4d;">
                Motivo del rechazo: <span th:text="${a.motivoRechazo}"></span>
            </p>
            <a th:if="${a.estado.name() == 'PENDIENTE'}"
               th:href="@{/anuncios/mios/{id}/editar(id=${a.id})}"
               class="btn-hero-secundario" style="width:auto; display:inline-block; text-decoration:none; margin-top:10px;">Editar</a>
        </div>

        <p th:if="${#lists.isEmpty(anuncios)}">Aún no has publicado anuncios.</p>
    </section>
</body>
</html>
