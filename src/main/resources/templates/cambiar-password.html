<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cambiar contraseña - Cambell</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <nav class="navbar">
        <div style="display:flex; align-items:center; gap:15px;">
            <a href="javascript:history.back()" class="nav-volver" title="Volver">←</a>
            <div class="logo">Cambell</div>
        </div>
        <div class="nav-links">
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" style="background:none; border:none; color:white; cursor:pointer; font-weight:500;">Cerrar sesión</button>
            </form>
        </div>
    </nav>

    <section class="auth-container">
        <div class="auth-card">
            <h2>Cambiar contraseña</h2>

            <div th:if="${error}" style="color:#ff4d4d; font-weight:600; margin-bottom:15px;" th:text="${error}"></div>
            <div th:if="${exito}" style="color:#7CE38B; font-weight:600; margin-bottom:15px;" th:text="${exito}"></div>

            <form th:action="@{/cliente/cambiar-password}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <label>Contraseña actual</label>
                <input type="password" name="passwordActual" required/>

                <label>Nueva contraseña</label>
                <input type="password" name="nuevaPassword" required minlength="8"
                       pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d).*"
                       title="Debe tener al menos 8 caracteres, una mayúscula, una minúscula y un número"/>
                <small style="color:#999; font-size:11px;">Mínimo 8 caracteres, con mayúscula, minúscula y número.</small>

                <button type="submit" class="btn-hero-principal" style="margin-top:20px;">Guardar contraseña</button>
            </form>
        </div>
    </section>

</body>
</html>
