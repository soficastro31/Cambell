<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Aprobar anuncios - Cambell</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <style>
        .admin-nav a { color:#ccc; text-decoration:none; margin-left:18px; font-weight:500; }
        .admin-nav a.activo { color:#FF6B00; }
    </style>
</head>
<body>
    <nav class="navbar admin-nav">
        <div class="logo">Cambell · Admin</div>
        <div>
            <a th:classappend="${seccion == 'verificaciones'} ? 'activo'" th:href="@{/admin/verificaciones}">Verificaciones</a>
            <a th:classappend="${seccion == 'usuarios'} ? 'activo'" th:href="@{/admin/usuarios}">Usuarios</a>
            <a th:classappend="${seccion == 'reportes'} ? 'activo'" th:href="@{/admin/reportes}">Reportes</a>
            <a th:classappend="${seccion == 'anuncios'} ? 'activo'" th:href="@{/admin/anuncios}">Anuncios</a>
            <a th:classappend="${seccion == 'estadisticas'} ? 'activo'" th:href="@{/admin/estadisticas}">Estadísticas</a>
            <form th:action="@{/logout}" method="post" style="display:inline; margin-left:18px;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" style="background:none; border:none; color:white; cursor:pointer; font-weight:500;">Cerrar sesión</button>
            </form>
        </div>
    </nav>

    <section style="padding: 40px 60px;">
        <h2 style="margin-bottom:25px;">Anuncios pendientes de revisión </h2>

        <div th:each="a : ${pendientes}" style="background:#1e1e1e; padding:20px; border-radius:8px; margin-bottom:15px;">
            <p><strong th:text="${a.titulo}"></strong></p>
            <p>Aliado: <span th:text="${a.aliado.nombre}"></span> (<span th:text="${a.aliado.correo}"></span>)</p>
            <img th:if="${a.rutaImagen != null}" th:src="@{${a.rutaImagen}}" style="max-width:180px; border-radius:6px; margin:10px 0;"/>
            <p style="color:#bbb;" th:text="${a.descripcion}"></p>
            <form th:action="@{/admin/anuncios/{id}/aprobar(id=${a.id})}" method="post" style="display:inline-block; margin-right:10px;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn-hero-principal" style="width:auto;">Aprobar</button>
            </form>
            <form th:action="@{/admin/anuncios/{id}/rechazar(id=${a.id})}" method="post" style="display:inline-block;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="text" name="motivo" placeholder="Motivo del rechazo" required
                       style="background:#2a2a2a; color:white; padding:8px; border-radius:6px; border:1px solid #333; margin-right:10px;"/>
                <button type="submit" class="btn-hero-secundario" style="width:auto;">Rechazar</button>
            </form>
        </div>
        <p th:if="${#lists.isEmpty(pendientes)}">No hay anuncios pendientes.</p>
    </section>
</body>
</html>
