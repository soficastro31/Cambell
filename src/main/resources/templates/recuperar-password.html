<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recuperar contraseña - Cambell</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <nav class="navbar">
        <div class="logo">Cambell</div>
        <div class="nav-links">
            <a th:href="@{/}">Inicio</a>
        </div>
    </nav>

    <section class="auth-container">
        <div class="auth-card">
            <h2>Recuperar contraseña</h2>

            <p th:if="${mensaje}" th:text="${mensaje}" style="color:#4dff88; background:#142a1a; padding:12px; border-radius:6px; margin-bottom:15px; font-size:14px;"></p>

            <form th:action="@{/recuperar-password}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <label>Correo registrado</label>
                <input type="email" name="correo" required/>

                <button type="submit" class="btn-hero-principal">Enviar enlace de recuperación</button>
            </form>
            <p class="auth-link"><a th:href="@{/login}">Volver a iniciar sesión</a></p>
        </div>
    </section>

    <footer class="footer">
        <p>&copy; Cambell 2026 - Todos los derechos reservados</p>
    </footer>

</body>
</html>
