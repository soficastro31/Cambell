<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reportes de seguridad - Cambell</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <style>
        .admin-nav a { color:#ccc; text-decoration:none; margin-left:18px; font-weight:500; }
        .admin-nav a.activo { color:#FF6B00; }
    </style>
</head>
<body>
    <nav class="navbar admin-nav">
        <div class="logo">Cambell · Admin</div>
        <div>
            <a th:classappend="${seccion == 'verificaciones'} ? 'activo'" th:href="@{/admin/verificaciones}">Verificaciones</a>
            <a th:classappend="${seccion == 'usuarios'} ? 'activo'" th:href="@{/admin/usuarios}">Usuarios</a>
            <a th:classappend="${seccion == 'reportes'} ? 'activo'" th:href="@{/admin/reportes}">Reportes</a>
            <a th:classappend="${seccion == 'anuncios'} ? 'activo'" th:href="@{/admin/anuncios}">Anuncios</a>
            <a th:classappend="${seccion == 'estadisticas'} ? 'activo'" th:href="@{/admin/estadisticas}">Estadísticas</a>
            <form th:action="@{/logout}" method="post" style="display:inline; margin-left:18px;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" style="background:none; border:none; color:white; cursor:pointer; font-weight:500;">Cerrar sesión</button>
            </form>
        </div>
    </nav>

    <section style="padding: 40px 60px;">
        <h2 style="margin-bottom:25px;">Reportes de seguridad </h2>

        <div th:each="r : ${reportes}" style="background:#1e1e1e; padding:20px; border-radius:8px; margin-bottom:15px;">
            <p><strong>Reporte #<span th:text="${r.id}"></span></strong></p>
            <p>Reportante: <span th:text="${r.reportante.nombre}"></span> (<span th:text="${r.reportante.correo}"></span>)</p>
            <p style="color:#ff6b6b;">Reportado: <strong th:text="${r.reportado.nombre}"></strong> (<span th:text="${r.reportado.correo}"></span>)</p>
            <p>Fecha: <span th:text="${r.fecha}"></span></p>
            <div style="background:#151a15; padding:12px; border-radius:6px; margin-top:10px;">
                <p style="margin:0; color:#bbb;" th:text="${r.motivo}"></p>
            </div>
            <div style="margin-top:15px;">
                <form th:action="@{/admin/reportes/{id}/bloquear(id=${r.id})}" method="post" style="display:inline-block; margin-right:10px;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn-hero-principal" style="width:auto; background:#7a2b2b;">Bloquear cuenta</button>
                </form>
                <form th:action="@{/admin/reportes/{id}/descartar(id=${r.id})}" method="post" style="display:inline-block;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn-hero-secundario" style="width:auto;">Descartar</button>
                </form>
            </div>
        </div>

        <p th:if="${#lists.isEmpty(reportes)}">No hay reportes pendientes de revisión.</p>
    </section>
</body>
</html>
