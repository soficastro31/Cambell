<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Restablecer contraseña - Cambell</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <nav class="navbar">
        <div class="logo">Cambell</div>
        <div class="nav-links">
            <a th:href="@{/}">Inicio</a>
        </div>
    </nav>

    <section class="auth-container">
        <div class="auth-card">
            <h2>Restablecer contraseña</h2>

            <p th:if="${error}" th:text="${error}" style="color:#ff4d4d; background:#2a1414; padding:12px; border-radius:6px; margin-bottom:15px; font-size:14px;"></p>

            <form th:if="${token != null}" th:action="@{/restablecer-password}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="token" th:value="${token}"/>

                <label>Nueva contraseña</label>
                <input type="password" name="password" required minlength="8"
                       placeholder="Mínimo 8 caracteres"/>

                <label>Confirmar contraseña</label>
                <input type="password" name="confirmarPassword" required minlength="8"/>

                <button type="submit" class="btn-hero-principal">Guardar nueva contraseña</button>
            </form>
            <p th:if="${token == null}" class="auth-link">
                <a th:href="@{/recuperar-password}">Solicitar un nuevo enlace</a>
            </p>
        </div>
    </section>

    <footer class="footer">
        <p>&copy; Cambell 2026 - Todos los derechos reservados</p>
    </footer>

</body>
</html>
