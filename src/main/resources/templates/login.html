<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión - Cambell</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <nav class="navbar">
    <div class="logo">Cambell</div>
        <div class="nav-links">
            <a th:href="@{/}">Inicio</a>
        </div>
    </nav>

    <section class="auth-container">
        <div class="auth-card">
            <h2>Iniciar sesión</h2>
            <form th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <label>Correo</label>
                <input type="text" name="username" required/>

                <label>Contraseña</label>
                <input type="password" name="password" required/>

                <button type="submit" class="btn-hero-principal">Ingresar</button>
            </form>
            <p class="auth-link">¿No tienes cuenta? <a th:href="@{/registro}">Regístrate aquí</a></p>
        </div>
    </section>
<footer class="footer">
        <p>&copy; Cambell 2026 - Todos los derechos reservados</p>
    </footer>
</body>
</html>
