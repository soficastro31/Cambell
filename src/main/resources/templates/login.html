<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión - Cambell</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <nav class="navbar">
        <div class="logo">Cambell</div>
        <div class="nav-links">
            <a th:href="@{/}">Inicio</a>
        </div>
    </nav>

    <section class="auth-container">
        <div class="auth-card">
            <h2>Iniciar sesión</h2>

            <p th:if="${error}" th:text="${error}" style="color:#ff4d4d; background:#2a1414; padding:12px; border-radius:6px; margin-bottom:15px; font-size:14px;"></p>
            <p th:if="${mensaje}" th:text="${mensaje}" style="color:#4dff88; background:#142a1a; padding:12px; border-radius:6px; margin-bottom:15px; font-size:14px;"></p>

            <form th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <label>Correo</label>
                <input type="email" name="username" required/>

                <label>Contraseña</label>
                <input type="password" name="password" required/>

                <button type="submit" class="btn-hero-principal">Ingresar</button>
            </form>
            <p class="auth-link">¿No tienes cuenta? <a th:href="@{/registro}">Regístrate aquí</a></p>
        </div>
    </section>

    <footer class="footer">
        <p>&copy; Cambell 2026 - Todos los derechos reservados</p>
    </footer>

</body>
</html>
