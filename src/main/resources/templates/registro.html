<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro - Cambell</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <nav class="navbar">
        <div class="logo">Cambell</div>
        <div class="nav-links">
            <a th:href="@{/}">Inicio</a>
        </div>
    </nav>

    <section class="auth-container">
        <div class="auth-card">
            <h2>Crear cuenta en Cambell</h2>
            <form th:action="@{/registro}" th:object="${usuario}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <label>Nombre</label>
                <input type="text" th:field="*{nombre}" required/>

                <label>Correo</label>
                <input type="email" th:field="*{correo}" required/>

                <label>Contraseña</label>
                <input type="password" th:field="*{password}" required/>

                <label>Rol</label>
                <select th:field="*{rol}" id="rolSelect" onchange="mostrarCamposTrabajador()">
                    <option value="CLIENTE">Cliente</option>
                    <option value="TRABAJADOR">Trabajador</option>
                </select>

                <div id="camposTrabajador" style="display:none;">
                    <p style="margin-top:20px; color:#FF6B00; font-weight:700; font-size:13px;">
                        VERIFICACIÓN DE IDENTIDAD REQUERIDA
                    </p>

                    <label>Número de documento</label>
                    <input type="text" th:field="*{numeroDocumento}" placeholder="Cédula de ciudadanía"/>

                    <label>Foto del documento (frente)</label>
                    <input type="file" name="documentoFile" accept="image/*"/>

                    <label>Selfie de verificación</label>
                    <input type="file" name="selfieFile" accept="image/*"/>

                    <p style="font-size:12px; color:#999; margin-top:10px;">
                        Tu cuenta quedará en revisión hasta que un administrador confirme tu identidad.
                    </p>
                </div>

                <button type="submit" class="btn-hero-principal">Registrarme</button>
            </form>
            <p class="auth-link">¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión aquí</a></p>
        </div>
    </section>

    <script>
        function mostrarCamposTrabajador() {
            const rol = document.getElementById('rolSelect').value;
            const campos = document.getElementById('camposTrabajador');
            campos.style.display = (rol === 'TRABAJADOR') ? 'block' : 'none';
        }
    </script>

</body>
</html>
