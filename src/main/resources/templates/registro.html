<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro - Cambell</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <nav class="navbar">
    <div class="logo">Cambell</div>
        <div class="nav-links">
            <a th:href="@{/}">Inicio</a>
        </div>
    </nav>

    <section class="auth-container">
        <div class="auth-card">
            <h2>Crear cuenta en Cambell</h2>
            <form th:action="@{/registro}" th:object="${usuario}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <label>Nombre</label>
                <input type="text" th:field="*{nombre}" required/>

                <label>Correo</label>
                <input type="email" th:field="*{correo}" required/>

                <label>Contraseña</label>
                <input type="password" th:field="*{password}" required/>

                <label>Rol</label>
                <select th:field="*{rol}">
                    <option value="TRABAJADOR">Trabajador</option>
                    <option value="CLIENTE">Cliente</option>
                </select>

                <button type="submit" class="btn-hero-principal">Registrarme</button>
            </form>
            <p class="auth-link">¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión aquí</a></p>
        </div>
    </section>

</body>
</html>
