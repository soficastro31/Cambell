<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar anuncio - Cambell</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <nav class="navbar">
        <div style="display: flex; align-items: center; gap: 15px;">
            <a href="javascript:history.back()" class="nav-volver" title="Volver">←</a>
            <div class="logo">Cambell</div>
        </div>
        <div class="nav-links">
            <a th:href="@{/anuncios/mios}">Mis anuncios</a>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" style="background:none; border:none; color:white; cursor:pointer; font-weight:500;">Cerrar sesión</button>
            </form>
        </div>
    </nav>

    <section class="auth-container">
        <div class="auth-card" style="max-width:520px;">
            <h2>Editar anuncio</h2>
            <form th:action="@{/anuncios/mios/{id}/editar(id=${anuncio.id})}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <label>Título</label>
                <input type="text" name="titulo" th:value="${anuncio.titulo}" required maxlength="100"/>
                <label>Descripción</label>
                <textarea name="descripcion" rows="4" required maxlength="1000"
                          style="width:100%; background:#2a2a2a; color:white; padding:12px; border-radius:6px; border:1px solid #333;"
                          th:text="${anuncio.descripcion}"></textarea>
                <label>Imagen (dejar vacío para conservar la actual)</label>
                <input type="file" name="imagen" accept="image/*"/>
                <button type="submit" class="btn-hero-principal" style="margin-top:25px; width:100%;">Guardar cambios</button>
            </form>
        </div>
    </section>
</body>
</html>
