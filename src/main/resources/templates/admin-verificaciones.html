<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Verificaciones pendientes - Cambell</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <nav class="navbar" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 30px;">
        <div class="logo">Cambell · Admin</div>
        <div>
            <a th:classappend="${seccion == 'verificaciones'} ? 'activo'" th:href="@{/admin/verificaciones}" style="color:#ccc; text-decoration:none; margin-left:18px; font-weight:500;">Verificaciones</a>
            <a th:classappend="${seccion == 'usuarios'} ? 'activo'" th:href="@{/admin/usuarios}" style="color:#ccc; text-decoration:none; margin-left:18px; font-weight:500;">Usuarios</a>
            <a th:classappend="${seccion == 'reportes'} ? 'activo'" th:href="@{/admin/reportes}" style="color:#ccc; text-decoration:none; margin-left:18px; font-weight:500;">Reportes</a>
            <a th:classappend="${seccion == 'anuncios'} ? 'activo'" th:href="@{/admin/anuncios}" style="color:#ccc; text-decoration:none; margin-left:18px; font-weight:500;">Anuncios</a>
            <a th:classappend="${seccion == 'estadisticas'} ? 'activo'" th:href="@{/admin/estadisticas}" style="color:#ccc; text-decoration:none; margin-left:18px; font-weight:500;">Estadísticas</a>
            <form th:action="@{/logout}" method="post" style="display:inline; margin-left:18px;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" style="background:none; border:none; color:white; cursor:pointer; font-weight:500;">Cerrar sesión</button>
            </form>
        </div>
    </nav>

    <section style="padding: 60px;">
        <h2 style="margin-bottom: 30px;">Verificaciones pendientes</h2>

        <div th:each="t : ${trabajadores}" style="background:#1e1e1e; padding:20px; border-radius:8px; margin-bottom:20px; display:flex; gap:20px; align-items:flex-start;">
            <div>
                <p><strong th:text="${t.nombre}"></strong></p>
                <p>Correo: <span th:text="${t.correo}"></span></p>
                <p>Documento: <span th:text="${t.numeroDocumento}"></span></p>

                <div style="display:flex; gap:15px; margin-top:15px;">
                    <div th:if="${t.rutaDocumento != null}">
                        <p style="font-size:12px; color:#999;">Documento</p>
                        <img th:src="@{${t.rutaDocumento}}" style="width:180px; border-radius:6px;"/>
                    </div>
                    <div th:if="${t.rutaSelfie != null}">
                        <p style="font-size:12px; color:#999;">Selfie</p>
                        <img th:src="@{${t.rutaSelfie}}" style="width:180px; border-radius:6px;"/>
                    </div>
                </div>

                <div style="margin-top:15px;">
                    <form th:action="@{/admin/verificaciones/{id}/aprobar(id=${t.id})}" method="post" style="display:inline-block; margin-right:10px;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn-hero-principal" style="width:auto;">Aprobar</button>
                    </form>
                    <form th:action="@{/admin/verificaciones/{id}/rechazar(id=${t.id})}" method="post" style="display:inline-block;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn-hero-secundario" style="width:auto;">Rechazar</button>
                    </form>
                </div>
            </div>
        </div>

        <p th:if="${#lists.isEmpty(trabajadores)}">No hay verificaciones pendientes.</p>
    </section>

</body>
</html>
