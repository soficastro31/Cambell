<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Verificación pendiente - Cambell</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <nav class="navbar" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 30px;">
        <div class="logo">Cambell</div>
        
        <!-- Botón de cerrar sesión -->
        <form th:action="@{/logout}" method="post" style="margin: 0;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn-hero-secundario" style="width: auto; padding: 8px 16px; font-size: 14px; cursor: pointer;">Cerrar sesión</button>
        </form>
    </nav>

    <section style="padding:100px 60px; text-align:center;">
        <h2>Tu cuenta está en revisión</h2>
        <p style="color:#999; margin-top:15px;">Un administrador está validando tu identidad. Te notificaremos cuando puedas empezar a recibir solicitudes.</p>
    </section>
</body>
</html>
