<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mis solicitudes - Cambell</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <nav class="navbar">
        <div class="logo">Cambell</div>
        <div class="nav-links">
            <a th:href="@{/solicitudes/nueva}" class="btn-nav">Nueva solicitud</a>
            <form th:action="@{/logout}" method="post" style="display:inline;">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <button type="submit" style="background:none; border:none; color:white; cursor:pointer; font-weight:500;">Cerrar sesión</button>
</form>
        </div>
    </nav>

    <section style="padding: 60px;">
        <h2 style="margin-bottom: 30px;">Mis solicitudes</h2>

        <div th:each="s : ${solicitudes}" style="background:#1e1e1e; padding:20px; border-radius:8px; margin-bottom:15px;">
            <p><strong th:text="${s.descripcion}"></strong></p>
            <p>Zona: <span th:text="${s.zona}"></span></p>
            <p>Estado: <span th:text="${s.estado}"></span></p>
            <p th:if="${s.trabajador != null}">Trabajador asignado: <span th:text="${s.trabajador.nombre}"></span></p>

            <form th:if="${s.estado.name() == 'PENDIENTE'}" th:action="@{/solicitudes/{id}/cancelar(id=${s.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn-hero-secundario">Cancelar</button>
            </form>
        </div>

        <p th:if="${#lists.isEmpty(solicitudes)}">Aún no tienes solicitudes.</p>
    </section>

</body>
</html>
