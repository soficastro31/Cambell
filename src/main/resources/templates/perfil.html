<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mi perfil - Cambell</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <style>
        .fila { margin: 10px 0; }
        .fila label { font-weight:600; color:#ccc; display:block; font-size:12px; }
        .fila span { font-size:16px; }
        .msg-exito { background:#1f2e1f; color:#7CE38B; padding:12px; border-radius:8px; margin-bottom:15px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div style="display:flex; align-items:center; gap:15px;">
            <a href="javascript:history.back()" class="nav-volver" title="Volver">←</a>
            <div class="logo">Cambell</div>
        </div>
        <div class="nav-links">
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" style="background:none; border:none; color:white; cursor:pointer; font-weight:500;">Cerrar sesión</button>
            </form>
        </div>
    </nav>

    <section class="auth-container">
        <div class="auth-card">
            <h2>Mi perfil</h2>

            <div th:if="${exito}" class="msg-exito" th:text="${exito}"></div>

            <div class="fila">
                <label>Nombre</label>
                <span th:text="${usuario.nombre}"></span>
            </div>
            <div class="fila">
                <label>Correo</label>
                <span th:text="${usuario.correo}"></span>
            </div>
            <div class="fila">
                <label>Rol</label>
                <span th:text="${usuario.rol}"></span>
            </div>
            <div class="fila" th:if="${usuario.numeroDocumento != null}">
                <label>Número de documento</label>
                <span th:text="${usuario.numeroDocumento}"></span>
            </div>
            <div class="fila" th:if="${usuario.calificacionPromedio != null and usuario.calificacionPromedio > 0}">
                <label>Calificación promedio</label>
                <span th:text="${#numbers.formatDecimal(usuario.calificacionPromedio, 1, 1)}"></span>
            </div>

            <div style="display:flex; gap:12px; margin-top:25px;">
                <a th:href="@{/cliente/editar}" class="btn-hero-principal" style="width:auto;">Editar datos</a>
                <a th:href="@{/cliente/cambiar-password}" class="btn-hero-secundario" style="width:auto;">Cambiar contraseña</a>
            </div>

            <!-- HU-U05: desactivar la propia cuenta -->
            <form th:action="@{/cliente/desactivar}" method="post" style="margin-top:25px; border-top:1px solid #333; padding-top:20px;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit"
                        onclick="return confirm('¿Seguro que quieres desactivar tu cuenta? Ya no aparecerás en búsquedas ni se te asignarán servicios. Esta acción es definitiva.');"
                        style="background:#3a1e1e; color:#ff6b6b; border:1px solid #7a3838; padding:12px 18px; border-radius:6px; font-weight:600; cursor:pointer;">
                    Desactivar mi cuenta
                </button>
            </form>
        </div>
    </section>

</body>
</html>
