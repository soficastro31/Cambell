<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Solicitudes disponibles - Cambell</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <nav class="navbar">
        <div class="logo">Cambell</div>
        <form th:action="@{/logout}" method="post" style="display:inline;">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <button type="submit" style="background:none; border:none; color:white; cursor:pointer; font-weight:500;">Cerrar sesión</button>
</form>
    </nav>

    <section style="padding: 60px;">
        <h2 style="margin-bottom: 30px;">Solicitudes disponibles en tu zona</h2>

        <form th:action="@{/solicitudes/disponibles}" method="get" style="margin-bottom: 30px;">
            <input type="text" name="zona" placeholder="Filtrar por zona (Ej. Chapinero, Bogotá)"
                   style="padding:12px; border-radius:6px; border:1px solid #333; background:#2a2a2a; color:white; width:300px;"/>
            <button type="submit" class="btn-hero-principal" style="width:auto; display:inline-block;">Buscar</button>
        </form>

        <div th:each="s : ${solicitudes}" style="background:#1e1e1e; padding:20px; border-radius:8px; margin-bottom:15px;">
            <p><strong th:text="${s.descripcion}"></strong></p>
            <p>Zona: <span th:text="${s.zona}"></span></p>
            <p>Cliente: <span th:text="${s.cliente.nombre}"></span></p>

            <form th:action="@{/solicitudes/{id}/aceptar(id=${s.id})}" method="post" style="display:inline-block; margin-right:10px;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn-hero-principal" style="width:auto;">Aceptar</button>
            </form>

            <form th:action="@{/solicitudes/{id}/rechazar(id=${s.id})}" method="post" style="display:inline-block;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn-hero-secundario" style="width:auto;">Rechazar</button>
            </form>
        </div>

        <p th:if="${#lists.isEmpty(solicitudes)}">No hay solicitudes disponibles en esta zona.</p>
    </section>

</body>
</html>
